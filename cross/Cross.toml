[build]
default-target = "aarch64-unknown-linux-gnu"

[build.env]
passthrough = [
  "CUDA_COMPUTE_CAP",
  "CUDA_NVCC_FLAGS",
  "CUDAFORGE_THREADS",
  "MISTRALRS_FEATURES",
  "NVCC",
  "NVCC_CCBIN",
  "CUDA_HOME",
  "CUDA_PATH",
  "CUDA_SBSA_ROOT",
  "CUDA_TARGET_ROOT",
  "LIBRARY_PATH",
  "BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu",
  "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS",
]

[target.aarch64-unknown-linux-gnu]
image = "fla-or-cross-jetson:jp721-cuda133"

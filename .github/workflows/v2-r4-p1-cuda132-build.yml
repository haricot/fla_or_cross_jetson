name: V2-R4-P1 CUDA 13.2 default-set cross build (no Jetson)

on:
  push:
    branches: [v2-r4-p1-cuda-default-probe]
    paths:
      - '.github/workflows/v2-r4-p1-cuda132-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda132-default-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
      - name: Verify pinned inputs and inspect disk
        shell: bash
        run: |
          set -Eeuo pipefail
          nix flake lock ./experiments/cuda-jetpack
          git diff --exit-code -- experiments/cuda-jetpack/flake.lock
          df -h / /nix
          nix eval --raw ./experiments/cuda-jetpack#packages.x86_64-linux.cuda13-2-default-cross-saxpy.drvPath
      - name: Compile AArch64 CUDA 13.2 with a pinned default set
        shell: bash
        run: |
          set -Eeuo pipefail
          out=$(nix build -L --keep-failed --no-link --print-out-paths ./experiments/cuda-jetpack#cuda13-2-default-cross-saxpy)
          binary="$out/bin/saxpy"
          test -x "$binary"
          file "$binary"
          file "$binary" | grep -q 'ARM aarch64'
          readelf -h "$binary" | grep -Eq 'Machine:.*AArch64'
          echo 'R4-P1 CUDA 13.2 default-set AArch64 ELF: PASS (compile/link only)'
          df -h / /nix
      - name: Print failed CMake CUDA compiler detection
        if: failure()
        shell: bash
        run: |
          for log in $(find /tmp -type f \( -name CMakeConfigureLog.yaml -o -name CMakeError.log -o -name CMakeOutput.log \) 2>/dev/null | head -8); do
            echo "::group::$log"
            tail -n 160 "$log" || true
            echo "::endgroup::"
          done

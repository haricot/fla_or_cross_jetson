name: V2-R4 upstream CUDA cross evaluation (no build)

on:
  push:
    branches: [v2-r234-nix-cross-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Verify pinned CUDA-probe lock
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s experiments/cuda-jetpack/flake.lock
          nix flake lock ./experiments/cuda-jetpack
          git diff --exit-code -- experiments/cuda-jetpack/flake.lock
          echo 'CUDA cross inputs pinned: PASS'
      - name: Evaluate CUDA 12.6 cross derivation
        run: nix eval --raw ./experiments/cuda-jetpack#packages.x86_64-linux.cuda12-6-cross-saxpy.drvPath
      - name: Evaluate CUDA 13.2 cross derivation
        run: nix eval --raw ./experiments/cuda-jetpack#packages.x86_64-linux.cuda13-2-cross-saxpy.drvPath

name: V2-R4 CUDA 13.2 cross build smoke (no Jetson)
on:
  push:
    branches: [v2-r234-nix-cross-foundation]
    paths:
      - '.github/workflows/v2-r4-cuda-build.yml'
      - 'experiments/cuda-jetpack/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda132-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
      - name: Verify locked upstream inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          nix flake lock ./experiments/cuda-jetpack
          git diff --exit-code -- experiments/cuda-jetpack/flake.lock
      - name: Display initial disk space and Nix build plan
        shell: bash
        run: |
          df -h / /nix
          nix build --dry-run --no-link ./experiments/cuda-jetpack#cuda13-2-cross-saxpy
      - name: Build and inspect AArch64 CUDA 13.2 SAXPY
        shell: bash
        run: |
          set -Eeuo pipefail
          out=$(nix build -L --no-link --print-out-paths ./experiments/cuda-jetpack#cuda13-2-cross-saxpy)
          binary="$out/bin/saxpy"
          test -x "$binary"
          file "$binary"
          file "$binary" | grep -q 'ARM aarch64'
          readelf -h "$binary" | grep -Eq 'Machine:.*AArch64'
          echo 'R4-P1 CUDA 13.2 cross-built AArch64 SAXPY: PASS (compile/link only, not GPU runtime)'
          df -h / /nix

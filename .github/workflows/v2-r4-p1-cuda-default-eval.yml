name: V2-R4-P1 default CUDA set eval (no build, no flash)

on:
  push:
    branches: [v2-r4-p1-cuda-default-probe]
    paths:
      - 'experiments/cuda-jetpack/**'
      - '.github/workflows/v2-r4-p1-cuda-default-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda-default-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check pinned inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          nix flake lock ./experiments/cuda-jetpack
          git diff --exit-code -- experiments/cuda-jetpack/flake.lock
      - name: Compare baseline and default-CUDA cross derivations
        shell: bash
        run: |
          set -Eeuo pipefail
          for attr in \
            cuda12-6-cross-saxpy \
            cuda12-6-default-cross-saxpy \
            cuda13-2-cross-saxpy \
            cuda13-2-default-cross-saxpy
          do
            drv=$(nix eval --raw "./experiments/cuda-jetpack#packages.x86_64-linux.${attr}.drvPath")
            printf '%s=%s\n' "$attr" "$drv"
          done
          echo 'R4-P1 CUDA versioned-default derivations evaluated; NO CUDA BUILD'

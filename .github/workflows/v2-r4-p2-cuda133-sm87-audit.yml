name: V2-R4-P2 CUDA 13.3 SM87 fatbin and ELF ABI audit (no Jetson)

on:
  push:
    branches: [v2-r4-p2-cuda133-sm87-audit]
    paths:
      - 'experiments/cuda-jetpack/flake.nix'
      - 'experiments/cuda-jetpack/flake.lock'
      - '.github/workflows/v2-r4-p2-cuda133-sm87-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda133-sm87-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
      - name: Check pinned inputs and derivation visibility (no build)
        shell: bash
        run: |
          set -Eeuo pipefail
          nix flake lock ./experiments/cuda-jetpack
          git diff --exit-code -- experiments/cuda-jetpack/flake.lock
          for attr in cuda13-2-default-cross-saxpy cuda13-3-default-cross-saxpy cuda13-3-host-cuobjdump; do
            nix eval --raw "./experiments/cuda-jetpack#packages.x86_64-linux.${attr}.drvPath"
          done
          df -h / /nix
      - name: Build CUDA 13.3 AArch64 SM87 sample and host cuobjdump
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p r4-p2-evidence
          out=$(nix build -L --no-link --print-out-paths './experiments/cuda-jetpack#cuda13-3-default-cross-saxpy')
          inspector=$(nix build -L --no-link --print-out-paths './experiments/cuda-jetpack#cuda13-3-host-cuobjdump')
          binary="$out/bin/saxpy"
          tool="$inspector/bin/cuobjdump"
          test -x "$binary"
          test -x "$tool"
          file "$binary" | tee r4-p2-evidence/file.txt
          readelf -h "$binary" | tee r4-p2-evidence/elf-header.txt
          readelf -l "$binary" > r4-p2-evidence/elf-program-headers.txt
          readelf -d "$binary" > r4-p2-evidence/elf-dynamic.txt
          readelf --version-info "$binary" > r4-p2-evidence/elf-symbol-versions.txt
          "$tool" --list-elf "$binary" | tee r4-p2-evidence/cuobjdump-list-elf.txt
          "$tool" --list-ptx "$binary" > r4-p2-evidence/cuobjdump-list-ptx.txt || true
          test -s r4-p2-evidence/cuobjdump-list-elf.txt
          grep -Eq 'Machine:.*AArch64' r4-p2-evidence/elf-header.txt
          # The actual embedded cubin must target Orin SM87; a CMake flag is insufficient.
          grep -Eq 'sm_87' r4-p2-evidence/cuobjdump-list-elf.txt
          echo 'PASS_CROSS_CUDA133_AARCH64_SM87_CUBIN' | tee r4-p2-evidence/status.txt
          {
            echo '### R4-P2 cross-compile evidence'
            echo '- CUDA 13.3 AArch64 compile/link: PASS'
            echo '- cuobjdump SM87 embedded cubin: PASS'
            echo '- Jetson runtime: NOT TESTED (no Jetson in CI)'
            echo '- JetPack 7.2.1 ships CUDA 13.2.2; 13.3 is an isolated compatibility experiment.'
            echo ''
            echo '#### ELF loader'
            grep 'Requesting program interpreter' r4-p2-evidence/elf-program-headers.txt || true
            echo ''
            echo '#### Dynamic libraries'
            grep 'NEEDED\|RPATH\|RUNPATH' r4-p2-evidence/elf-dynamic.txt || true
            echo ''
            echo '#### GPU fatbin'
            head -40 r4-p2-evidence/cuobjdump-list-elf.txt
          } >> "$GITHUB_STEP_SUMMARY"
          df -h / /nix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-p2-cuda133-sm87-elf-evidence
          path: r4-p2-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Print failed CMake compiler detection
        if: failure()
        shell: bash
        run: |
          for log in $(find /tmp -type f \( -name CMakeConfigureLog.yaml -o -name CMakeError.log -o -name CMakeOutput.log \) 2>/dev/null | head -8); do
            echo "::group::$log"
            tail -n 120 "$log" || true
            echo "::endgroup::"
          done

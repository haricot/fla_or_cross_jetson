[project]
name = "fla-or-cross-jetson"
revision = "1.0"
require_reason = true

[providers]
workstation = "keyring://"
runtime = "systemd-credential://"

[profiles.headless.defaults]
inherit = false
required = false
providers = ["workstation"]

[profiles.headless]
JETSON_PASSWORD = { description = "Password provisioned for the headless Jetson user" }
WIFI_PSK = { description = "Wi-Fi PSK provisioned into the Jetson NetworkManager profile" }

[profiles.cross.defaults]
inherit = false
required = false
providers = ["workstation"]

[profiles.cross]
GITHUB_TOKEN = { description = "Optional GitHub token for private source repositories" }
GHCR_TOKEN = { description = "Optional container-registry token for private images" }

[profiles.runtime.defaults]
inherit = false
required = false
providers = ["runtime"]

[profiles.runtime]
HF_TOKEN = { description = "Optional Hugging Face token exposed to a systemd-managed Jetson service" }
API_TOKEN = { description = "Generic application API token exposed to a systemd-managed Jetson service" }
